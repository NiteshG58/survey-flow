<app-loading-spinner [loading]="!contentReady"></app-loading-spinner>

<div *ngIf="contentReady" class="bg_colr" [dir]="rtlLangCheck ? 'rtl' : 'ltr'" [class.rtl-mode]="rtlLangCheck">
    <div class="container">
        <div class="wrap infrmtion">
            <div class="InstNameDiv">
                <h1 class="InstName">{{ instructionLabel }}</h1>
            </div>

            <!-- Consolidated Custom Message with line-break preservation if set in settings -->
            <div class="row text_final" *ngIf="srvyMsgPara">
                <p style="white-space: pre-line;">{{ srvyMsgPara }}</p>
            </div>

            <!-- Fallback to default translation messages if no custom message exists -->
            <div *ngIf="!srvyMsgPara">
                <div class="row text_final" *ngIf="msgPara">
                    <p>{{ msgPara }}</p>
                </div>
                <div class="row text_final" *ngIf="prdctOpinionMsg">
                    <p>{{ prdctOpinionMsg }}</p>
                </div>
                <div class="row text_final" *ngIf="rsnpAns">
                    <p>{{ rsnpAns }}</p>
                </div>
            </div>

            <!-- Optional additional Group/Pre-Survey Message -->
            <div class="row" *ngIf="preSurvMsg" style="margin-top: 1.5rem; margin-bottom: 1.5rem;">
                <h3 class="text-color" style="font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem;">
                    {{ grpMsgLabel }}
                </h3>
                <b style="font-weight: 600;">{{ preSurvMsg }}</b>
            </div>

            <!-- Action Button -->
            <div class="row max_height" [style.justify-content]="rtlLangCheck ? 'flex-end' : 'flex-start'">
                <button class="next_btn" (click)="startSurvey()" [disabled]="isLoading">
                    <span *ngIf="!isLoading">{{ btnLtsDo }}</span>
                    <span *ngIf="isLoading">Loading…</span>
                </button>
            </div>
        </div>
    </div>
</div>
