<div [dir]="rtlLangCheck ? 'rtl' : 'ltr'" [class.rtl-mode]="rtlLangCheck" class="survey-container">
    <div class="loading-overlay" *ngIf="loading">
        <app-loading-spinner [loading]="true"></app-loading-spinner>
    </div>

    <div class="card shadow-lg border-0 rounded-4" *ngIf="!loading && currentQuestion">
        <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
            <h5 class="text-secondary small text-uppercase fw-bold m-0" *ngIf="isStartHeading">
                Survey Introduction
            </h5>
            <div class="progress mt-3" style="height: 6px;">
                <div class="progress-bar" role="progressbar" style="width: 50%"></div>
            </div>
        </div>

        <div class="card-body p-4">
            <h2 class="h4 fw-bold mb-4 text-dark" [innerHTML]="currentQuestion.questionText"></h2>

            <!-- Success/Counter Feedback for Multi-punch -->
            <div *ngIf="currentQuestion.questionType === 1" class="alert alert-info border-0 rounded-3 small py-2">
                Selected: <span class="fw-bold">{{ selectedCheckboxes }}</span>
                <span *ngIf="currentQuestion.termsCount"> / Max: {{ currentQuestion.termsCount }}</span>
            </div>

            <!-- Single Punch (Radio) -->
            <div class="mb-4" *ngIf="currentQuestion.questionType === 0">
                <div class="list-group list-group-flush border rounded-3">
                    <label *ngFor="let opt of currentQuestion.questionOptions"
                        class="list-group-item list-group-item-action d-flex align-items-center cursor-pointer py-3"
                        [class.active]="demographic.selected_opt == opt.id">
                        <input type="radio" name="survey_radio" [value]="opt.id" [(ngModel)]="demographic.selected_opt"
                            class="form-check-input me-3">
                        <span [innerHTML]="opt.optText"></span>
                    </label>
                </div>
            </div>

            <!-- Multi Punch (Checkbox) -->
            <div class="mb-4" *ngIf="currentQuestion.questionType === 1">
                <div class="list-group list-group-flush border rounded-3">
                    <label *ngFor="let opt of currentQuestion.questionOptions"
                        class="list-group-item list-group-item-action d-flex align-items-center cursor-pointer py-3"
                        [class.active]="multiPunchSelection[opt.id]">
                        <input type="checkbox" [checked]="multiPunchSelection[opt.id]" (change)="cbClicks(opt)"
                            class="form-check-input me-3">
                        <span [innerHTML]="opt.optText"></span>
                    </label>
                </div>
            </div>

            <!-- Text & Numeric (Date integrated) -->
            <div class="mb-4" *ngIf="currentQuestion.questionType === 2 || currentQuestion.questionType === 3">
                <input *ngIf="currentQuestion.questionKey !== 'BIRTH_DATE'"
                    [type]="currentQuestion.questionType === 3 ? 'number' : 'text'"
                    class="form-control form-control-lg rounded-3" [(ngModel)]="demographic.selected_opt"
                    [placeholder]="currentQuestion.questionType === 3 ? 'Enter number...' : 'Type your answer...'">

                <input *ngIf="currentQuestion.questionKey === 'BIRTH_DATE'" type="date"
                    class="form-control form-control-lg rounded-3" [(ngModel)]="demographic.selected_opt"
                    [min]="minDate" [max]="maxDate" (change)="validateDate()">

                <div *ngIf="isNotValidDate" class="text-danger small mt-2">
                    <i class="bi bi-exclamation-triangle-fill"></i> Please enter a valid date (min age requirement).
                </div>
            </div>

            <div class="d-grid mt-5">
                <button class="btn btn-primary btn-lg rounded-3 py-3 fw-bold survey-btn" (click)="onNext()"
                    [disabled]="onceClickNext || (currentQuestion.questionType == 1 && selectedCheckboxes == 0) || (currentQuestion.questionType != 1 && !demographic.selected_opt) || isNotValidDate">
                    {{ onceClickNext ? 'Processing...' : 'Next Question' }}
                    <i class="bi bi-arrow-right ms-2" *ngIf="!onceClickNext"></i>
                </button>
            </div>
        </div>
    </div>
</div>
